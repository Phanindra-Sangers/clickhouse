# =============================================================================
# Production-grade ClickHouse + Keeper for a 3-node cluster
# Topology: 3 Keepers (quorum, tolerates 1 loss) + ClickHouse 1 shard x 3 replicas
# Operator: ClickHouse/clickhouse-operator, apiVersion clickhouse.com/v1alpha1
#
# Before applying, create the default-user password Secret (see bottom of file)
# and set storageClassName to a real, non-local, retained StorageClass.
# =============================================================================
---
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: prod
  namespace: clickhouse
  labels:
    app.kubernetes.io/part-of: clickhouse-prod
spec:
  replicas: 3                         # odd number for quorum; 3 tolerates 1 failure

  # Spread the 3 Keeper pods across distinct nodes. Setting nodeHostnameKey
  # turns on the operator's default anti-affinity so two Keepers never share a node.
  podTemplate:
    nodeHostnameKey: kubernetes.io/hostname
    topologyZoneKey: topology.kubernetes.io/zone   # also spread across zones if multi-AZ
    terminationGracePeriodSeconds: 60

  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: "25.3"                     # pin to a current LTS; verify the tag exists on Docker Hub
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        memory: 2Gi                   # leave CPU unlimited; Keeper is latency-sensitive

  # Keeper needs a small but FAST, low-latency disk (it fsyncs the Raft log).
  dataVolumeClaimSpec:
    accessModes: ["ReadWriteOnce"]
    storageClassName: fast-ssd        # CHANGE ME: an SSD-backed, Retain-policy class
    resources:
      requests:
        storage: 20Gi

  # Keep at most one Keeper down during voluntary disruptions (node drains, upgrades).
  podDisruptionBudget:
    maxUnavailable: 1

  settings:
    logger:
      level: information
      jsonLogs: true
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: prod
  namespace: clickhouse
  labels:
    app.kubernetes.io/part-of: clickhouse-prod
spec:
  shards: 1
  replicas: 3                         # 1 shard x 3 replicas: every node holds a full copy

  keeperClusterRef:
    name: prod                        # same namespace as this resource

  upgradeChannel: lts                 # only propose LTS major upgrades

  podTemplate:
    nodeHostnameKey: kubernetes.io/hostname        # one replica per node
    topologyZoneKey: topology.kubernetes.io/zone
    terminationGracePeriodSeconds: 120
    # Run ClickHouse on dedicated, labeled+tainted nodes so it does not compete
    # with other workloads. Label/taint the nodes, then uncomment:
    # nodeSelector:
    #   workload: clickhouse
    # tolerations:
    #   - key: dedicated
    #     operator: Equal
    #     value: clickhouse
    #     effect: NoSchedule
    # priorityClassName: high-priority   # keep DB pods from being evicted under pressure
    # imagePullSecrets:                  # pull images from a private registry
    #   - name: registry-creds

  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-server
      tag: "25.3"                     # pin; keep server and keeper on compatible versions
    # imagePullPolicy: IfNotPresent
    # env:                             # extra container env, e.g. force the server timezone
    #   - name: TZ
    #     value: UTC
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
      limits:
        memory: 32Gi                  # do NOT set a CPU limit on ClickHouse; it throttles queries

  dataVolumeClaimSpec:
    accessModes: ["ReadWriteOnce"]
    storageClassName: fast-ssd        # CHANGE ME: SSD-backed, Retain reclaim policy
    resources:
      requests:
        storage: 500Gi                # size for your data + ~30% headroom for merges

  podDisruptionBudget:
    maxUnavailable: 1                 # with 3 replicas, keeps a majority serving during drains

  settings:
    # default-user password sourced from a Secret (never inline a password here)
    defaultUserPassword:
      passwordType: sha256_hash
      secret:
        name: clickhouse-default-user
        key: password-sha256
    logger:
      level: information
      jsonLogs: true
    # TLS is supported via settings.tls.enabled + a cert Secret (cert-manager).
    # Enable once you have an issuer wired up:
    # tls:
    #   enabled: true
    #   required: false
    #   serverCertSecret:
    #     name: clickhouse-server-tls
    #
    # Cold-tier lifecycle: keep hot data on SSD and move old data to MinIO
    # automatically while it stays queryable. Uncomment, set the MinIO endpoint,
    # bucket, and keys (prefer a <named_collections> entry over inline keys), then
    # create tables with `SETTINGS storage_policy = 'hot_cold'` and a TTL such as
    # `TTL order_date + INTERVAL 90 DAY TO VOLUME 'cold'`. Verify the extraConfig
    # nesting against your operator version before relying on it.
    # extraConfig:
    #   storage_configuration:
    #     disks:
    #       s3_cold:
    #         type: s3
    #         endpoint: http://minio.minio.svc.cluster.local:9000/clickhouse-cold/
    #         access_key_id: <ACCESS_KEY>
    #         secret_access_key: <SECRET_KEY>
    #     policies:
    #       hot_cold:
    #         volumes:
    #           hot:
    #             disk: default      # the SSD data volume the operator provisions
    #           cold:
    #             disk: s3_cold      # MinIO
    #
    # enableDatabaseSync: true        # default; sync databases to newly added replicas
    #
    # =========================================================================
    # USERS, ROLES, QUOTAS  (access control)
    # =========================================================================
    # Maps to SOC 2 access-control objectives: least privilege, per-user limits,
    # network restriction, and named accounts instead of a shared superuser.
    # extraUsersConfig merges into the ClickHouse users config.
    #
    # NEVER inline a plaintext password. Use password_sha256_hex with a placeholder
    # and source the real hash from a Secret. Generate one with:
    #   echo -n '<password>' | sha256sum
    # For passwordless service accounts prefer client TLS certs, not no_password.
    # extraUsersConfig:
    #   # ----- profiles: cap resources and lock down behavior; one per user -----
    #   profiles:
    #     readonly:
    #       readonly: 1               # 0 = read/write, 1 = SELECT only, 2 = SELECT + SET
    #       allow_ddl: 0              # block CREATE / ALTER / DROP
    #       max_memory_usage: 10000000000        # 10 GB per query
    #       max_execution_time: 60               # seconds, then the query is killed
    #       max_rows_to_read: 2000000000
    #       max_result_rows: 1000000
    #     etl:
    #       readonly: 0
    #       allow_ddl: 1
    #       max_memory_usage: 40000000000        # 40 GB for heavy inserts/merges
    #   # ----- quotas: rate-limit a user over a rolling interval -----
    #   quotas:
    #     bi_quota:
    #       interval:
    #         duration: 3600          # per hour
    #         queries: 10000
    #         errors: 500
    #         result_rows: 100000000
    #         read_rows: 5000000000
    #         execution_time: 3600
    #   # ----- users -----
    #   users:
    #     # 1) Read-only BI user for Superset (least privilege; use THIS, not default).
    #     bi_readonly:
    #       password_sha256_hex: <SHA256_OF_PASSWORD>
    #       profile: readonly
    #       quota: bi_quota
    #       networks:
    #         ip: "10.0.0.0/8"        # restrict to the Superset pod CIDR; avoid ::/0 in prod
    #       allow_databases:          # limit which databases the user can see
    #         database:
    #           - default
    #           - analytics
    #     # 2) ETL / ingestion user: can write, cannot administer.
    #     etl_writer:
    #       password_sha256_hex: <SHA256_OF_PASSWORD>
    #       profile: etl
    #       quota: default
    #       networks:
    #         ip: "10.0.0.0/8"
    #     # 3) Admin user with SQL-driven RBAC enabled (manage roles/grants via SQL).
    #     ch_admin:
    #       password_sha256_hex: <SHA256_OF_PASSWORD>
    #       profile: default
    #       networks:
    #         ip: "10.0.0.0/8"
    #       access_management: 1            # may run CREATE USER/ROLE, GRANT, REVOKE
    #       named_collection_control: 1     # may manage named_collections
    #       show_named_collections: 1
    #
    # Prefer SQL-driven RBAC for everything beyond these bootstrap users, so grants
    # live in the database (and replicate) rather than in this file:
    #   CREATE ROLE analyst;
    #   GRANT SELECT ON analytics.* TO analyst;
    #   CREATE USER alice IDENTIFIED WITH sha256_password BY '<pw>' HOST IP '10.0.0.0/8';
    #   GRANT analyst TO alice;
    #   CREATE ROW POLICY region_filter ON analytics.sales USING country = 'US' TO analyst;
    # LDAP / Active Directory auth is supported too: add an <ldap_servers> entry in
    # extraConfig and set `ldap: { server: my_ad }` on the user instead of a hash.
    #
    # NOTE: there is only ONE extraConfig: block. The cold-tier storage_configuration
    # above, the named_collections here, and the prometheus block below all live
    # under the SAME extraConfig:. If you enable more than one, merge their keys
    # under a single extraConfig: rather than repeating the key (duplicate YAML key).
    #
    # Everything below lives under one extraConfig: (named creds, audit logs,
    # server settings, prometheus). Shown separately for readability.
    #
    # Named credentials so s3() ingestion and S3 table engines reference a name
    # instead of inlining MinIO keys in SQL. Mount the keys from a Secret in prod.
    # Use as: s3(minio, filename='sales/*.parquet', format='Parquet')
    # extraConfig:
    #   named_collections:
    #     minio:
    #       url: http://minio.minio.svc.cluster.local:9000/<BUCKET>/
    #       access_key_id: <ACCESS_KEY>
    #       secret_access_key: <SECRET_KEY>
    #
    #   # =====================================================================
    #   # AUDIT LOGGING  (SOC 2 audit trail)
    #   # =====================================================================
    #   # These system tables are the audit trail. Each block sets a retention TTL
    #   # so the tables do not grow without bound. Query them with normal SQL,
    #   # e.g. SELECT * FROM system.session_log WHERE type = 'LoginFailure'.
    #   #
    #   # session_log: every authentication attempt, success AND failure, with user,
    #   # client address, and interface. This is the login/access audit trail and
    #   # the key one for SOC 2. Off by default; this block enables it.
    #   session_log:
    #     database: system
    #     table: session_log
    #     engine: "ENGINE = MergeTree ORDER BY event_time TTL event_date + INTERVAL 90 DAY"
    #   # query_log: every statement executed (text, user, rows, duration, memory).
    #   query_log:
    #     engine: "ENGINE = MergeTree ORDER BY event_time TTL event_date + INTERVAL 90 DAY"
    #   # part_log: data-part lifecycle (merges, mutations, moves to cold tier).
    #   part_log:
    #     engine: "ENGINE = MergeTree ORDER BY event_time TTL event_date + INTERVAL 30 DAY"
    #   # query_views_log + text_log round out the picture; keep text_log short.
    #   text_log:
    #     level: information
    #     engine: "ENGINE = MergeTree ORDER BY event_time TTL event_date + INTERVAL 14 DAY"
    #   # Make SQL-driven RBAC the system of record and forbid the plaintext
    #   # `password` field, so only hashed or cert/LDAP auth is accepted.
    #   access_control_improvements:
    #     users_without_row_policies_can_read_rows: false
    #
    #   # Useful server-wide guardrails:
    #   max_concurrent_queries: 200
    #
    #   # Prometheus metrics on :9363 (the operator service already exposes the port;
    #   # add scrape annotations via spec.annotations if your Prometheus needs them).
    #   prometheus:
    #     endpoint: /metrics
    #     port: 9363
    #     metrics: true
    #     events: true
    #     asynchronous_metrics: true
